apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: generative-vector-tile
  namespace: knative-pool
spec:
  template:
    metadata:
      annotations:
        # This service is not a scale-to-zero workload, and treating it as
        # one was a mistake in the original design.
        #
        # Serving tiles straight out of remote Parquet only works because
        # DuckDB's external file cache absorbs the row-group reads: one z16
        # divisions tile costs 80s against a cold cache and 1.5s against a
        # warm one. That cache lives in the process, so a pod is not
        # interchangeable with a fresh one -- scaling to zero discards the
        # single most valuable thing the pod owns, and the next visitor pays
        # the 80s again. Cloudflare cuts the request off at 100s, so on a bad
        # day they do not even get the tile.
        #
        # Keep one pod resident and let it hold the cache. The idle cost of
        # one pod is the price of the service working at all on the first
        # request.
        autoscaling.knative.dev/min-scale: "1"
        # Cache locality argues for 1 and throughput argues for more; left
        # at 3 deliberately, since the fast datasets (places, buildings, the
        # Natural Earth ones) benefit from the parallelism and only divisions
        # is punished by landing on a cold pod.
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "5"
        # Same reasoning as min-scale, one level down: a pod that scaled up
        # during a pan burst has spent real time warming its cache, so give
        # it 5 minutes of grace instead of the old 60s. Note the flip side --
        # a scaled-up pod starts cold, so a burst wide enough to spill onto a
        # second pod still sees slow tiles on that pod (see max-scale).
        autoscaling.knative.dev/scale-down-delay: "300s"
    spec:
      containerConcurrency: 5
      timeoutSeconds: 300
      containers:
        - image: generative-vector-tile:0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: HOME
              value: /tmp
            # LLM backend for the `q=` filter compiler. These were set on the
            # live revision but missing from this manifest, so a plain
            # `kubectl apply` silently dropped them and every `q=` request
            # started returning 503 "LLM not configured".
            - name: OPENAI_BASE_URL
              value: http://llama-server.knative-pool.svc.cluster.local:8080/v1
            - name: OPENAI_API_KEY
              value: dummy
            - name: OPENAI_MODEL
              value: gvt-llm
            - name: LLM_TIMEOUT_S
              value: "30"
            - name: DUCKDB_QUERY_TIMEOUT_S
              value: "30"
            # DuckDB sizes memory_limit from host RAM, not the cgroup limit
            # (it read 75 GiB on this node), so it must be told explicitly or
            # the external file cache will grow into an OOMKill. Keep it under
            # the container limit below.
            - name: DUCKDB_MEMORY_LIMIT
              value: 3GB
            - name: DUCKDB_THREADS
              value: "4"
            # Pull the viewer's default divisions view through DuckDB before
            # the pod reports ready, so the first real request hits a warm
            # file cache instead of a 80s cold read.
            - name: WARMUP_TILES
              value: divisions/11/1819/806
          resources:
            requests:
              cpu: "200m"
              memory: "1Gi"
            limits:
              cpu: "2"
              # Headroom for the external file cache (DUCKDB_MEMORY_LIMIT=3GB
              # above); the cache is the entire point of keeping this pod warm.
              memory: "4Gi"
