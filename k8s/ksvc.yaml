apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: generative-vector-tile
  namespace: knative-pool
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containerConcurrency: 5
      timeoutSeconds: 300
      containers:
        - image: generative-vector-tile:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
