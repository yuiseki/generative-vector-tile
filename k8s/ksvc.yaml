apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: generative-vector-tile
  namespace: knative-pool
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
        autoscaling.knative.dev/target: "5"
        autoscaling.knative.dev/scale-down-delay: "60s"
    spec:
      containerConcurrency: 5
      timeoutSeconds: 300
      containers:
        - image: generative-vector-tile:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: HOME
              value: /tmp
            # LLM backend for the `q=` filter compiler. These were set on the
            # live revision but missing from this manifest, so a plain
            # `kubectl apply` silently dropped them and every `q=` request
            # started returning 503 "LLM not configured".
            - name: OPENAI_BASE_URL
              value: http://llama-server.knative-pool.svc.cluster.local:8080/v1
            - name: OPENAI_API_KEY
              value: dummy
            - name: OPENAI_MODEL
              value: gvt-llm
            - name: LLM_TIMEOUT_S
              value: "30"
            - name: DUCKDB_QUERY_TIMEOUT_S
              value: "30"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
